[moneyflow-dev]
image=ubuntu:24.04
pull=false
init=false
root=false
replace=false
start_now=true

additional_packages="curl git unzip xz-utils build-essential"
additional_packages="sqlite3"

init_hooks="curl -fsSL https://nodejs.org/dist/v22.15.0/node-v22.15.0-linux-x64.tar.xz -o /tmp/node.tar.xz && tar -xf /tmp/node.tar.xz -C /usr/local --strip-components=1 && rm /tmp/node.tar.xz"
init_hooks="npm install -g pnpm@10.33.0"
init_hooks="echo 'Node.js '$(node -v)' e pnpm '$(pnpm -v)' instalados.'"
